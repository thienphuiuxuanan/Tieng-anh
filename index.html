<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Đề thi Ngữ pháp: Bị động & Tương lai</title>
<style>
:root{--bg1:#eef2ff;--bg2:#fdf2f8;--card:#fff;--tx:#1e1b4b;--mu:#6b7280;--pr:#6366f1;--ok:#16a34a;--no:#dc2626;--bd:#e5e7eb;--sh:0 10px 30px rgba(99,102,241,.2);--okb:#dcfce7;--nob:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg1:#0f172a;--bg2:#1e1b4b;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155;--pr:#818cf8;--sh:0 10px 30px rgba(0,0,0,.5);--okb:#14532d;--nob:#7f1d1d}}
:root[data-theme="dark"]{color-scheme:dark;--bg1:#0f172a;--bg2:#1e1b4b;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155;--pr:#818cf8;--sh:0 10px 30px rgba(0,0,0,.5);--okb:#14532d;--nob:#7f1d1d}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg1));background-size:300% 300%;animation:bg 14s ease infinite;min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.3;z-index:0;animation:fl 12s ease-in-out infinite}
.b1{width:220px;height:220px;background:#6366f1;top:5%;left:-60px}.b2{width:260px;height:260px;background:#ec4899;bottom:5%;right:-80px;animation-delay:-4s}
@keyframes fl{50%{transform:translate(40px,-50px) scale(1.2)}}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:14px}
#th{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:20;border:0;border-radius:50%;width:40px;height:40px;font-size:19px;background:var(--card);box-shadow:var(--sh);cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--sh);margin-top:48px}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.85);opacity:0}}
.shake{animation:shk .45s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
h1{margin:0 0 4px;font-size:26px}.mu{color:var(--mu);font-size:13px;margin:4px 0}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input{width:100%;padding:11px;border-radius:12px;border:2px solid var(--bd);background:transparent;color:var(--tx);font-size:16px;font-family:inherit}input:focus{outline:0;border-color:var(--pr)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--bd);background:transparent;color:var(--tx);border-radius:14px;padding:12px;text-align:left;font-size:18px;font-weight:700;cursor:pointer;transition:.2s}
.mode small{display:block;font-weight:400;font-size:12px;color:var(--mu);margin-top:4px}
.mode.sel{border-color:var(--pr);background:rgba(99,102,241,.12);transform:scale(1.03)}
.go{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(90deg,#6366f1,#ec4899);cursor:pointer;animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px rgba(99,102,241,.2)}}
.sec{background:transparent;border:2px solid var(--bd);color:var(--tx);animation:none}
.cd{text-align:center;padding-top:25vh}.num{font-size:120px;font-weight:900;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;animation:zm .85s ease-out}
@keyframes zm{from{transform:scale(2.5);opacity:0}60%{opacity:1}}
#hd{position:sticky;top:0;z-index:10;background:var(--card);margin:0 -14px;padding:10px 60px 8px 14px;box-shadow:var(--sh);font-size:14px;font-weight:600;display:flex;gap:12px;flex-wrap:wrap}
.pg{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;width:100%}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#ec4899);transition:width .3s}
h2{margin:22px 0 8px;color:var(--pr);font-size:18px}
.q{display:flex;gap:10px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;animation:pop .4s backwards}
.q.ok{border-color:var(--ok);background:var(--okb)}.q.no{border-color:var(--no);background:var(--nob)}
.qn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pr);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.qb{flex:1;min-width:0}.qt{font-size:17px;line-height:1.9}
.qt input{display:inline-block;width:190px;max-width:100%;padding:3px 8px;border-radius:8px;border-width:0 0 2px;margin:0 3px;font-size:16px}
.qt+input,.wide{margin-top:6px}
.rs{font-size:13px;margin-top:6px}
.tb{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}.tb th,.tb td{border:1px solid var(--bd);padding:6px 8px;text-align:center}.tb th{background:rgba(99,102,241,.15)}.tb td:first-child{text-align:left}
.ov{overflow-x:auto}.big{font-size:56px;font-weight:900;text-align:center;color:var(--pr)}.gr{text-align:center;font-size:20px;font-weight:700}
.x{color:var(--no);font-weight:700}.v{color:var(--ok);font-weight:700}
.warn{background:#f59e0b;color:#fff;border-radius:12px;padding:10px;margin-top:12px;text-align:center;font-weight:600;animation:pop .3s}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<button id="th" title="Sáng / tối">🌓</button><div id="app"></div>
<script>
const RAW=`P|The window ___ (break) by the boy yesterday.|was broken|Quá khứ + bị động: was/were + V3.
P|English ___ (speak) in many countries.|is spoken|Hiện tại đơn bị động: am/is/are + V3.
P|The report ___ (finish) already.|has been finished|already → hiện tại hoàn thành bị động.
P|These cars ___ (make) in Japan.|are made|Chủ ngữ số nhiều → are + V3.
F|Look at the sky! It ___ (rain).|is going to rain|Có dấu hiệu ở hiện tại → be going to.
F|Perhaps she ___ (pass) the exam.|will pass|Perhaps/probably (phỏng đoán) → will.
F|We have booked the hotel, so we ___ (visit) Da Nang next month.|are going to visit|Đã có kế hoạch từ trước → be going to.
P|The cake ___ (eat) by the children last night.|was eaten|Quá khứ bị động: was + V3.
F|“The phone is ringing.” – “I ___ (answer) it.”|will answer|Quyết định tức thời → will.
B|Look! The old house ___ (demolish).|is going to be demolished|Có dấu hiệu + bị động → is going to be + V3.
P|The homework ___ (not do) yet.|has not been done|yet → hiện tại hoàn thành bị động.
B|Tomorrow the winner ___ (announce) by the judges.|will be announced|Tương lai bị động: will be + V3.
F|I promise I ___ (not tell) anyone your secret.|will not tell|Lời hứa → will.
F|She is pregnant. She ___ (have) a baby in May.|is going to have|Có dấu hiệu rõ ràng → be going to.
P|This song ___ (write) by a famous singer in 1990.|was written|Năm 1990 → quá khứ bị động.
P|The room ___ (clean) every day.|is cleaned|Thói quen + bị động → is + V3.
P|The thief ___ (arrest) by the police last week.|was arrested|last week → quá khứ đơn, không dùng hiện tại hoàn thành.
F|Be careful! You ___ (fall).|are going to fall|Cảnh báo dựa trên tình huống hiện tại → be going to.
F|It’s so hot. I ___ (open) the window.|will open|Quyết định ngay lúc nói → will.
B|The meeting ___ (hold) in this room tomorrow.|will be held|Tương lai bị động: will be + V3.
P|Our house ___ (paint) at the moment.|is being painted|at the moment → is being + V3.
B|The students ___ (give) a test next Monday.|will be given|Tương lai bị động: will be + V3.
P|The documents must ___ (sign) before Friday.|be signed|Modal bị động: modal + be + V3.
F|He has decided to study medicine. He ___ (study) it at university.|is going to study|Đã quyết định từ trước → be going to.
F|Don’t worry. I ___ (help) you with that.|will help|Lời đề nghị tại chỗ → will.
P|The child ___ (take) to school by his father every morning.|is taken|Thói quen + bị động → is + V3.
P|This room ___ (use) for meetings since 2020.|has been used|since → hiện tại hoàn thành bị động.
B|Many trees ___ (plant) in the park next spring.|will be planted|Tương lai bị động: will be + V3.
F|Oh, I have a headache. I think I ___ (take) an aspirin.|will take|Quyết định tức thời → will.
F|She has bought flour and eggs. She ___ (bake) a cake.|is going to bake|Đã chuẩn bị sẵn → be going to (chủ động).
P|[Bị động] People speak English all over the world.|English is spoken all over the world.
P|[Bị động] They built this school in 1990.|This school was built in 1990.
P|[Bị động] Someone has stolen my bike.|My bike has been stolen.
B|[Bị động] The teacher will give us a test.|We will be given a test by the teacher.
P|[Chủ động] The cake was made by my mother.|My mother made the cake.
B|[Chủ động] A new road will be built by the government.|The government will build a new road.
P|[Chủ động] The letters have been written by Tom.|Tom has written the letters.
B|[Bị động] Tom is going to repair the car.|The car is going to be repaired by Tom.
P|[Bị động] They are painting the walls.|The walls are being painted.
P|[Chủ động] The window was broken by Peter.|Peter broke the window.
F|[Be going to] I will meet my friends tonight (đã sắp xếp từ trước).|I am going to meet my friends tonight.
F|[Phủ định] She will come to the party.|She will not come to the party.
F|[Nghi vấn] They will move to London.|Will they move to London?
F|[Phủ định] He is going to sell his car.|He is not going to sell his car.
F|[Nghi vấn] You are going to buy a new phone.|Are you going to buy a new phone?
B|[Bị động] Someone will clean the office tomorrow.|The office will be cleaned tomorrow.
B|[Bị động] The company is going to launch a new product.|A new product is going to be launched by the company.
P|[Bị động] They did not invite me to the party.|I was not invited to the party.
P|[Bị động – nghi vấn] Did someone open the door?|Was the door opened?
P|[Bị động] You must finish this work today.|This work must be finished today.`;
const DEF={P:"Giữ nguyên thì của câu gốc; bị động = be + V3.",F:"will + V (tức thời, hứa, phỏng đoán); be going to + V (dự định, có dấu hiệu).",B:"Tương lai bị động: will be + V3 / is (am, are) going to be + V3."};
const ALT={"will be announced":["is going to be announced"],"will be held":["is going to be held"],"will be given":["are going to be given"],"will be planted":["are going to be planted"],"We will be given a test by the teacher.":["A test will be given to us by the teacher.","A test will be given to us."]};
const CAT={P:"Chủ động ⇄ Bị động",F:"Tương lai đơn ⇄ tương lai gần",B:"Bị động ở tương lai"};
const Q=RAW.trim().split("\n").map(l=>{const [c,q,a,h]=l.split("|");return{c,q,a,h:h||DEF[c],t:q[0]==="["}});
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const st={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const th=st.get("theme");if(th)document.documentElement.dataset.theme=th;
$("#th").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;st.set("theme",n)};
const norm=s=>{s=String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/won't/g,"will not").replace(/can't/g,"cannot").replace(/n't/g," not").replace(/'ll/g," will").replace(/'m/g," am").replace(/'re/g," are").replace(/'s going/g," is going").replace(/[.,!?;:"“”]/g," ").replace(/\s+/g," ").trim();return s.replace(/ by (?:the |a |an |my |his |her |our |their )?\w+(?: \w+)?$/,"")};
const accept=q=>{const l=[q.a,...(ALT[q.a]||[])];l.forEach(a=>{if(/going to/.test(a)&&!q.t)l.push(a.replace(/^(am|is|are) (not )?/,"$2"))});return l};
function confetti(n){const cl=["#6366f1","#ec4899","#f59e0b","#22c55e","#06b6d4"];for(let i=0;i<n;i++){const e=document.createElement("i");e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;background:${cl[i%5]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.4}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}}
let S={mode:"easy"},tmr;
function home(){clearInterval(tmr);const nm=st.get("name")||"";app.innerHTML=`<div class="card pop"><h1>📝 Đề thi Ngữ pháp</h1><p class="mu">50 câu · Chủ động ⇄ Bị động · Tương lai đơn (will) ⇄ Tương lai gần (be going to)</p><label>Tên của bạn</label><input id="nm" maxlength="20" placeholder="Nhập tên…" value="${esc(nm)}"><label>Chế độ</label><div class="modes"><button class="mode sel" data-m="easy">🌱 Dễ<small>Có gợi ý + từ đầu tiên của đáp án · không giới hạn giờ</small><small>Kỷ lục: ${st.get("best_easy")||0}/10</small></button><button class="mode" data-m="hard">🔥 Khó<small>Không gợi ý · câu có bẫy từ khóa · 30 phút, hết giờ tự nộp</small><small>Kỷ lục: ${st.get("best_hard")||0}/10</small></button></div><p class="mu">Cách làm: làm lần lượt từ câu 1 đến 50, rồi bấm “Nộp bài” để chấm và xem bảng thống kê. Câu will / be going to thì gõ cả cụm, ví dụ <b>will buy</b> hoặc <b>is going to buy</b>.</p><button class="go" id="go">Bắt đầu ➜</button></div>`;S.mode="easy";
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");S.mode=b.dataset.m});
$("#go").onclick=()=>{const v=$("#nm").value.trim();if(!v){const c=$(".card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");$("#nm").focus();return}st.set("name",v);S={mode:S.mode,name:v};countdown()}}
function countdown(){app.innerHTML=`<div class="cd"><div class="num" id="cn">3</div><p class="gr">Sẵn sàng nào, <span id="cname"></span>!</p></div>`;$("#cname").textContent=S.name;const seq=["3","2","1","GO!"];let k=0;const n=$("#cn");const t=setInterval(()=>{k++;if(k>=seq.length){clearInterval(t);confetti(40);return setTimeout(exam,600)}n.textContent=seq[k];n.style.animation="none";void n.offsetWidth;n.style.animation=""},850)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
function exam(){const hard=S.mode==="hard";S.warn=false;S.done=false;S.t0=Date.now();
let h=`<div id="hd"><span>👤 <span id="hn"></span></span><span>✍️ <b id="an">0</b>/50</span><span>⏱ <b id="tm">${hard?"30:00":"00:00"}</b></span><span>${hard?"🔥 Khó":"🌱 Dễ"}</span><div class="pg"><i id="pb"></i></div></div><div id="res"></div><div id="qs">`;
Q.forEach((q,i)=>{if(i===0)h+="<h2>PART A · Điền dạng đúng của động từ trong ngoặc</h2>";if(i===30)h+="<h2>PART B · Viết lại câu theo yêu cầu trong [ ]</h2>";
const hint=hard?"":`<div class="mu">💡 ${esc(q.h)} · 🔤 Bắt đầu bằng: <b>${esc(q.a.split(" ")[0])}</b></div>`;
const inp=`<input data-i="${i}" class="ai${q.t?" wide":""}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.t?"Gõ cả câu…":"…"}">`;
h+=`<div class="q" id="q${i}" style="animation-delay:${Math.min(i,8)*.05}s"><div class="qn">${i+1}</div><div class="qb"><div class="qt">${q.t?esc(q.q):esc(q.q).replace("___",inp)}</div>${q.t?inp:""}${hint}<div class="rs"></div></div></div>`});
h+=`</div><div id="wn"></div><button class="go" id="sub">📤 Nộp bài</button><div style="height:30px"></div>`;
app.innerHTML=h;$("#hn").textContent=S.name;
app.oninput=()=>{const n=[...document.querySelectorAll(".ai")].filter(x=>x.value.trim()).length;$("#an").textContent=n;$("#pb").style.width=n/50*100+"%"};
app.onkeydown=e=>{if(e.key==="Enter"&&e.target.classList.contains("ai")){e.preventDefault();const a=[...document.querySelectorAll(".ai")],i=a.indexOf(e.target);(a[i+1]||$("#sub")).focus()}};
$("#sub").onclick=()=>{const n=+$("#an").textContent;if(n<50&&!S.warn){S.warn=true;$("#wn").innerHTML=`<div class="warn">⚠️ Còn ${50-n} câu chưa làm. Bấm “Nộp bài” lần nữa nếu muốn nộp luôn.</div>`;const b=$("#sub");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");return}grade()};
tmr=setInterval(()=>{const s=(Date.now()-S.t0)/1000;if(hard){const l=Math.max(0,1800-s);$("#tm").textContent=fmt(l);if(l<300)$("#tm").style.color="var(--no)";if(l<=0)grade()}else $("#tm").textContent=fmt(s)},500)}
function grade(){if(S.done)return;S.done=true;clearInterval(tmr);const used=Math.min((Date.now()-S.t0)/1000,1800);
const R=Q.map((q,i)=>{const el=document.querySelector(`[data-i="${i}"]`),v=el.value.trim(),ok=!!v&&accept(q).some(a=>norm(a)===norm(v));el.disabled=true;
const b=$("#q"+i);b.classList.add(ok?"ok":"no");b.querySelector(".rs").innerHTML=ok?'<span class="v">✅ Đúng</span>':`<span class="x">❌ ${v?"Sai":"Bỏ trống"}</span> · Đáp án: <b>${esc(q.a)}</b><br>💡 ${esc(q.h)}`;return{q,v,ok,i}});
$("#sub").remove();$("#wn").innerHTML="";const ok=R.filter(r=>r.ok).length,sc=ok*.2,pct=Math.round(ok/50*100);
const key="best_"+S.mode,nb=sc>(+st.get(key)||0);if(nb)st.set(key,sc.toFixed(1));
const g=pct>=90?"Xuất sắc 🏆":pct>=75?"Giỏi 🌟":pct>=50?"Khá 👍":"Cố lên nhé 💪";
const row=(l,f)=>{const a=R.filter(f),o=a.filter(r=>r.ok).length,b=a.filter(r=>!r.v).length;return`<tr><td>${l}</td><td class="v">${o}</td><td class="x">${a.length-o-b}</td><td>${b}</td><td><b>${a.length?Math.round(o/a.length*100):0}%</b></td></tr>`};
const head="<tr><th>Nội dung</th><th>Đúng</th><th>Sai</th><th>Trống</th><th>%</th></tr>";
const det=R.map(r=>`<tr><td>${r.i+1}</td><td>${r.v?esc(r.v):"—"}</td><td>${esc(r.q.a)}</td><td>${r.ok?"✅":"❌"}</td></tr>`).join("");
$("#res").innerHTML=`<div class="card pop" style="margin-top:14px"><h1 style="text-align:center">🏁 Kết quả</h1><p class="gr"><span id="rn"></span> · ${S.mode==="hard"?"🔥 Khó":"🌱 Dễ"}</p><div class="big"><span id="bs">0.0</span>/10</div><div class="gr">${g}</div>${nb?'<p class="gr" style="color:#f59e0b">🎊 Kỷ lục mới!</p>':""}<p class="mu" style="text-align:center">${ok}/50 câu đúng · Thời gian làm bài ${fmt(used)}</p><h3>📊 Thống kê theo phần và chủ đề</h3><div class="ov"><table class="tb">${head}${row("Part A (điền)",r=>!r.q.t)}${row("Part B (viết lại)",r=>r.q.t)}${["P","F","B"].map(c=>row(CAT[c],r=>r.q.c===c)).join("")}<tr><td><b>Tổng</b></td><td class="v">${ok}</td><td class="x">${R.filter(r=>r.v&&!r.ok).length}</td><td>${R.filter(r=>!r.v).length}</td><td><b>${pct}%</b></td></tr></table></div><details><summary><b>Bảng chi tiết 50 câu</b></summary><div class="ov"><table class="tb"><tr><th>Câu</th><th>Bạn trả lời</th><th>Đáp án</th><th></th></tr>${det}</table></div></details><button class="go" id="again">Làm lại 🔁</button><button class="go sec" id="hm">Đổi chế độ / tên</button></div>`;
$("#rn").textContent=S.name;let v=0;const t=setInterval(()=>{v=Math.min(sc,v+.2);$("#bs").textContent=v.toFixed(1);if(v>=sc)clearInterval(t)},40);
